services:
  postgres:
    image: postgres:17-alpine
    container_name: rinklink-minimal-postgres
    environment:
      POSTGRES_DB: rinklink-minimal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rinklink-minimal"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    image: python:3.11-slim
    container_name: rinklink-minimal-backend
    working_dir: /workspace/backend
    depends_on:
      mailpit:
        condition: service_started
      postgres:
        condition: service_healthy
    env_file:
      - ./backend/.env.example
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/rinklink-minimal
      MEDIA_ROOT: /workspace/backend/media
      CORS_ORIGINS: http://localhost:5183,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174
      FRONTEND_URL: http://localhost:5183
      APP_ENV: development
      AUTH_ENABLED: "true"
      AUTH_BYPASS_DEV_ONLY: "false"
      AUTH_REQUIRE_MFA_FOR_PRIVILEGED: "false"
      AUTH_INTERNAL_BASE_URL: http://auth-service:3000
      AUTH_JWKS_URL: http://auth-service:3000/.well-known/jwks.json
      AUTH_ISSUER: http://localhost:3100
      AUTH_AUDIENCE: rinklink-minimal-api
      EMAIL_FROM_NAME: RinkLink
      EMAIL_FROM_ADDRESS: no-reply@rinklink-minimal.local
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_STARTTLS: "false"
      SMTP_USE_SSL: "false"
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
      alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8100:8000"
    volumes:
      - ./backend:/workspace/backend

  auth-service:
    image: node:20-alpine
    container_name: rinklink-minimal-auth-service
    working_dir: /workspace/auth-service
    depends_on:
      mailpit:
        condition: service_started
      postgres:
        condition: service_healthy
    env_file:
      - ./auth-service/.env.example
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/rinklink-minimal?options=-c%20search_path%3Dauth
      BETTER_AUTH_URL: http://localhost:3100
      FRONTEND_URL: http://localhost:5183
      TRUSTED_ORIGINS: http://localhost:5183,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174
      API_AUDIENCE: rinklink-minimal-api
      APP_ENV: development
      BETTER_AUTH_SECRET: local-dev-secret-change-this-to-a-long-random-value
      EMAIL_FROM_NAME: RinkLink
      EMAIL_FROM_ADDRESS: no-reply@rinklink-minimal.local
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_STARTTLS: "false"
      SMTP_USE_SSL: "false"
    command: >
      sh -c "npm install &&
      npm run dev"
    ports:
      - "3100:3000"
    volumes:
      - ./auth-service:/workspace/auth-service

  frontend:
    image: node:20-alpine
    container_name: rinklink-minimal-frontend
    working_dir: /workspace/frontend
    depends_on:
      backend:
        condition: service_started
      auth-service:
        condition: service_started
    environment:
      VITE_API_BASE_URL: http://localhost:8100
      VITE_AUTH_BASE_URL: http://localhost:3100
      VITE_PROXY_API_TARGET: http://backend:8000
    command: >
      sh -c "npm install &&
      npm run dev -- --host 0.0.0.0"
    ports:
      - "5183:5173"
    volumes:
      - ./frontend:/workspace/frontend

  mailpit:
    image: axllent/mailpit:v1.27
    container_name: rinklink-minimal-mailpit
    ports:
      - "1125:1025"
      - "8125:8025"

volumes:
  postgres-data:
